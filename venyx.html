<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Script Roblox - Video mới | Roblox Mod Hub</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #070b14;
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --border: rgba(56, 189, 248, 0.12);
      --border-hover: rgba(56, 189, 248, 0.45);
      --text-1: #e2e8f0;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #0ea5e9;
      --accent-2: #0284c7;
      --accent-soft: #7dd3fc;
      --accent-glow: rgba(14, 165, 233, 0.28);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 450px at 50% 0%, rgba(14, 165, 233, 0.10), transparent 60%),
        radial-gradient(ellipse 600px 450px at 50% 100%, rgba(2, 132, 199, 0.08), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 20px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.5s ease-out both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .logo svg { width: 30px; height: 30px; fill: #fff; }

    h1 {
      font-size: clamp(20px, 4.5vw, 26px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.35;
      background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      animation: fadeUp 0.4s ease-out both;
    }

    .btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(14, 165, 233, 0.15);
    }

    .btn:active { transform: translateY(0); }

    .btn-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(14, 165, 233, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.25s;
    }

    .btn:hover .btn-icon { transform: scale(1.1); }

    .btn-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-desc {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-arrow {
      flex-shrink: 0;
      color: var(--text-3);
      font-size: 18px;
      transition: all 0.25s;
    }

    .btn:hover .btn-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    .btn-special {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      border: 1px solid rgba(125, 211, 252, 0.35);
      padding: 20px 20px;
      box-shadow: 0 10px 32px rgba(14, 165, 233, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-special:hover {
      box-shadow: 0 16px 40px rgba(14, 165, 233, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-color: rgba(125, 211, 252, 0.6);
    }

    .btn-special::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.18) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: shine 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    .btn-special .btn-num {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .btn-special .btn-icon { background: rgba(255, 255, 255, 0.15); }
    .btn-special .btn-title,
    .btn-special .btn-desc,
    .btn-special .btn-arrow { color: #fff; }
    .btn-special .btn-desc { opacity: 0.9; }
    .btn-special:hover .btn-arrow { color: #fff; }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      z-index: 2;
    }

    /* ====== KHU VỰC NHẬP MẬT KHẨU ====== */
    .password-section {
      background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px 20px; text-align: center; animation: fadeUp 0.5s ease-out 0.2s both;
    }
    .password-section h2 { font-size: 18px; color: var(--accent-soft); margin-bottom: 8px; }
    .password-section p { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
    .password-section p a { color: var(--accent); font-weight: 700; text-decoration: none; border-bottom: 1px dotted var(--accent); }
    .input-group { display: flex; gap: 10px; }
    .input-group input {
      flex: 1; padding: 12px 14px; background: var(--bg-0); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-1); font-size: 15px; outline: none;
    }
    .input-group input:focus { border-color: var(--accent); }
    .input-group button {
      padding: 12px 20px; background: var(--accent); border: none; border-radius: 10px;
      color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;
    }
    .input-group button:hover { background: var(--accent-2); }
    .msg { font-size: 13px; margin-top: 12px; font-weight: 600; color: #f87171; min-height: 20px; }

    /* ====== KHUNG CHỨA SCRIPT KẾT QUẢ ====== */
    #result-area { margin-top: 24px; display: none; }
    .script-box {
      background: var(--bg-1); border: 1px solid var(--accent); border-radius: var(--radius);
      padding: 16px; animation: fadeUp 0.4s ease-out both;
    }
    .script-text {
      font-family: monospace; font-size: 13px; color: #a7f3d0; word-break: break-all; white-space: pre-wrap;
      background: var(--bg-0); padding: 12px; border-radius: 8px; max-height: 250px; overflow-y: auto;
    }
    .copy-btn {
      margin-top: 12px; background: rgba(14, 165, 233, 0.15); color: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.3); padding: 12px; border-radius: 8px;
      cursor: pointer; font-weight: 700; width: 100%; font-size: 15px; transition: 0.2s;
    }
    .copy-btn:hover { background: rgba(14, 165, 233, 0.25); color: #fff; }

    footer {
      text-align: center;
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-3);
      animation: fadeUp 0.5s ease-out 0.2s both;
    }

    footer .copyright-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shine {
      0%   { transform: translateX(-100%); }
      60%  { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }

    @media (max-width: 480px) {
      .wrap { padding: 40px 16px 30px; }
      .btn { padding: 14px; gap: 12px; }
      .btn-icon { width: 36px; height: 36px; font-size: 18px; }
      .btn-special { padding: 18px 16px; }
      .btn-title { font-size: 14px; }
      .logo { width: 54px; height: 54px; }
      .logo svg { width: 26px; height: 26px; }
      .input-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.674 1.268 1.269 22.719l17.057.011 4.405-21.463L5.674 1.268zM16.32 15.771l-6.339 1.302-1.302-6.34 6.34-1.301 1.301 6.339z"/>
        </svg>
      </div>
      <h1>Vượt 1 trong 4 link này để lấy script nhé</h1>
    </header>

    <!-- KHU VỰC 4 NÚT LINK -->
    <div class="links" id="links"></div>

    <!-- KHU VỰC NHẬP MẬT KHẨU -->
    <div class="password-section">
      <h2>Nhập mật khẩu để lấy script ngay lập tức</h2>
      <p>Nếu bạn không có, hãy liên hệ với <a href="https://www.tiktok.com/@zankyo2114" target="_blank">tôi</a> để mua mật khẩu nhé.</p>
      
      <div class="input-group">
        <input type="password" id="pwInput" placeholder="Nhập mật khẩu...">
        <button id="submitBtn">Lấy Script</button>
      </div>
      <div class="msg" id="modalMsg"></div>
    </div>

    <!-- KHUNG HIỂN THỊ SCRIPT KẾT QUẢ -->
    <div id="result-area"></div>

    <footer>
      <span class="copyright-text">
        © Bản quyền của @zankyo2114 và @kenjobraly
      </span>
    </footer>
  </div>

  <script>
  (() => {
    // 4 Link rút gọn thật của bạn
    const LINKS = {
      link4m: "https://link4m.net/v6xnG7",
      bumxReview: "https://linkfree.click/s/venyxz1u1ck9mvt2fm85",
      bbmkts: "https://bbmkts.com/go/suLL8",
      linkforearn: "http://linkforearn.com/hzLJrY"
    };

    // Link Worker Cloudflare
    const WORKER_URL = "https://modgame.phucpro4211.workers.dev/api/verify";

    // Tự động lấy tên file làm ID (Ví dụ: venyx.html -> ID là "venyx")
    let filename = window.location.pathname.split('/').pop();
    let VIDEO_ID = filename.replace('.html', '');
    if (!VIDEO_ID || VIDEO_ID === 'index') VIDEO_ID = 'default';

    const container = document.getElementById('links');
    const pwInput = document.getElementById('pwInput');
    const submitBtn = document.getElementById('submitBtn');
    const modalMsg = document.getElementById('modalMsg');
    const resultArea = document.getElementById('result-area');

    // --- 1. VẼ 4 NÚT LINK (Giữ nguyên giao diện của bạn) ---
    const buttons = [];

    if (LINKS.link4m.trim()) {
      buttons.push(`
        <a class="btn btn-special" href="${LINKS.link4m.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="badge">KHUYÊN DÙNG</span>
          <span class="btn-num">1</span>
          <span class="btn-icon">⚡</span>
          <span class="btn-content">
            <span class="btn-title">Link4M</span>
            <span class="btn-desc">Dễ lấy mã</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }
    if (LINKS.bumxReview.trim()) {
      buttons.push(`
        <a class="btn" href="${LINKS.bumxReview.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="btn-num">2</span>
          <span class="btn-icon">🎬</span>
          <span class="btn-content">
            <span class="btn-title">Bumx Review</span>
            <span class="btn-desc">Nhanh nhất</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }
    if (LINKS.bbmkts.trim()) {
      buttons.push(`
        <a class="btn" href="${LINKS.bbmkts.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="btn-num">3</span>
          <span class="btn-icon">💰</span>
          <span class="btn-content">
            <span class="btn-title">Bbmkts</span>
            <span class="btn-desc">Dùng khi 2 link kia hết lượt</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }
    if (LINKS.linkforearn.trim()) {
      buttons.push(`
        <a class="btn" href="${LINKS.linkforearn.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="btn-num">4</span>
          <span class="btn-icon">💵</span>
          <span class="btn-content">
            <span class="btn-title">LinkForEarn</span>
            <span class="btn-desc">Dùng khi 2 link kia hết lượt</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }

    if (buttons.length === 0) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>Chưa có link nào được thêm.</div>`;
    } else {
      container.innerHTML = buttons.join('');
      container.querySelectorAll('.btn').forEach((el, i) => {
        el.style.animationDelay = `${i * 60}ms`;
      });
    }

    // --- 2. XỬ LÝ NHẬP MẬT KHẨU ---
    submitBtn.addEventListener('click', async () => {
      const pw = pwInput.value.trim();
      if (!pw) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang kiểm tra...';
      modalMsg.textContent = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw, id: VIDEO_ID })
        });

        const result = await res.json();

        if (res.ok && result.success) {
          // ĐÚNG MẬT KHẨU
          modalMsg.textContent = '';
          submitBtn.textContent = 'Thành công!';
          submitBtn.style.background = '#10b981';
          pwInput.disabled = true;
          
          renderResult(result.type, result.content);
        } else {
          // SAI MẬT KHẨU
          modalMsg.textContent = result.message || 'Sai mật khẩu!';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Lấy Script';
        }
      } catch (err) {
        modalMsg.textContent = 'Lỗi kết nối, thử lại sau!';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Lấy Script';
      }
    });

    pwInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });

    // --- 3. HIỂN THỊ KẾT QUẢ ---
    function renderResult(type, content) {
      resultArea.style.display = 'block';
      
      if (type === 'link') {
        resultArea.innerHTML = `
          <a href="${content}" target="_blank" class="btn btn-special" style="justify-content:center;">
            <span class="btn-title">🚀 Bấm vào đây để đến link gốc</span>
          </a>
        `;
      } else if (type === 'script') {
        resultArea.innerHTML = `
          <div class="script-box">
            <div class="script-text" id="script-text">${content}</div>
            <button class="copy-btn" id="copyBtn">📋 Copy Script</button>
          </div>
        `;
        
        document.getElementById('copyBtn').addEventListener('click', () => {
          const text = document.getElementById('script-text').innerText;
          navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ Đã Copy!';
            btn.style.color = '#10b981';
            setTimeout(() => { btn.textContent = '📋 Copy Script'; btn.style.color = ''; }, 2000);
          });
        });
      }
    }
  })();
  </script>
</body>
</html>
