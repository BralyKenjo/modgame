name: Update videos.json

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
  workflow_dispatch: # ← thêm dòng này để có nút bấm chạy tay

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ← bắt buộc, nếu thiếu sẽ không commit được

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate videos.json
        run: node scripts/generate.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update videos.json"
          file_pattern: 'videos.json'
