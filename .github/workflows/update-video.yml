# .github/workflows/update-videos.yml
name: Update videos.json

on:
  push:
    branches:
      - main
    paths:
      - '*.html' # Chỉ chạy khi có file html mới thay đổi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cần quyền ghi để commit đè file videos.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate videos.json
        run: node scripts/generate.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update videos.json"
          file_pattern: 'videos.json'
