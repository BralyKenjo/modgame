<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f1a">
  <!-- ⬇️ SỬA TITLE Ở ĐÂY cho mỗi video -->
  <title>Script Roblox - Video mới | Roblox Mod Hub</title>

  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #0b0f1a;
      --bg-1: #121826;
      --bg-2: #1a2235;
      --border: rgba(148, 163, 184, 0.12);
      --border-hover: rgba(239, 68, 68, 0.5);
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #ef4444;
      --accent-2: #dc2626;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 50% 0%, rgba(239, 68, 68, 0.18), transparent 60%),
        radial-gradient(ellipse 500px 400px at 50% 100%, rgba(220, 38, 38, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== LAYOUT ========== */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 20px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========== HEADER ========== */
    header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.5s ease-out both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px var(--accent-glow);
      font-size: 28px;
    }

    h1 {
      font-size: clamp(20px, 4.5vw, 26px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.35;
      background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ========== LINKS ========== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* ========== BUTTON BASE ========== */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      animation: fadeUp 0.4s ease-out both;
    }

    .btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(239, 68, 68, 0.2);
    }

    .btn:active { transform: translateY(0); }

    /* Số thứ tự */
    .btn-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* Icon */
    .btn-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.25s;
    }

    .btn:hover .btn-icon { transform: scale(1.1); }

    .btn-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-desc {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-arrow {
      flex-shrink: 0;
      color: var(--text-3);
      font-size: 18px;
      transition: all 0.25s;
    }

    .btn:hover .btn-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ========== ĐẶC BIỆT: LINK4M ========== */
    .btn-special {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 20px 20px;
      box-shadow: 0 10px 36px rgba(239, 68, 68, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .btn-special:hover {
      box-shadow: 0 16px 44px rgba(239, 68, 68, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Shine chạy qua */
    .btn-special::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: shine 3s ease-in-out infinite;
      pointer-events: none;
    }

    .btn-special .btn-num {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .btn-special .btn-icon {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-special .btn-title,
    .btn-special .btn-desc,
    .btn-special .btn-arrow {
      color: #fff;
    }

    .btn-special .btn-desc { opacity: 0.85; }
    .btn-special:hover .btn-arrow { color: #fff; }

    /* Badge "KHUYÊN DÙNG" */
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 2;
    }

    /* ========== NHÓM BUMX (2 cột) ========== */
    .bumx-group {
      display: flex;
      gap: 10px;
    }

    .bumx-group .btn {
      flex: 1;
      min-width: 0;
      padding: 14px 14px;
      gap: 10px;
    }

    .bumx-group .btn-icon {
      width: 34px;
      height: 34px;
      font-size: 17px;
    }

    .bumx-group .btn-title { font-size: 13px; }
    .bumx-group .btn-desc  { font-size: 11px; }
    .bumx-group .btn-num   { width: 22px; height: 22px; font-size: 11px; }
    .bumx-group .btn-arrow { display: none; }

    /* ========== FOOTER ========== */
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-3);
      animation: fadeUp 0.5s ease-out 0.2s both;
    }

    footer .copyright-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    footer a {
      color: #fca5a5;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dotted rgba(239, 68, 68, 0.4);
      transition: color 0.2s, border-color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ========== EMPTY STATE ========== */
    .empty {
      text-align: center;
      padding: 48px 24px;
      background: var(--bg-1);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-2);
      font-size: 14px;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shine {
      0%   { transform: translateX(-100%); }
      60%  { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }

    /* ========== MOBILE ========== */
    @media (max-width: 480px) {
      .wrap { padding: 40px 16px 30px; }
      .btn { padding: 14px; gap: 12px; }
      .btn-icon { width: 36px; height: 36px; font-size: 18px; }
      .btn-special { padding: 18px 16px; }
      .btn-title { font-size: 14px; }
      .bumx-group { gap: 8px; }
      .bumx-group .btn { padding: 12px 10px; gap: 8px; }
      .bumx-group .btn-icon { width: 30px; height: 30px; font-size: 15px; }
      .bumx-group .btn-title { font-size: 12px; }
      .bumx-group .btn-desc { display: none; }
    }

    @media (max-width: 360px) {
      .bumx-group { flex-direction: column; }
      .bumx-group .btn-desc { display: block; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🟥</div>
      <h1>Vượt 1 trong 4 link này để lấy script nhé</h1>
    </header>

    <div class="links" id="links">
      <!-- Nút sẽ được render bằng JS bên dưới -->
    </div>

    <footer>
      <span class="copyright-text">
        © Bản quyền thuộc kênh
        <a href="https://www.tiktok.com/@zankyo2114" target="_blank" rel="noopener noreferrer">@zankyo2114</a>
      </span>
    </footer>
  </div>

  <script>
  (() => {
    /* =========================================================
       ⬇️⬇️⬇️  CHỈ SỬA PHẦN NÀY MỖI KHI LÀM VIDEO MỚI  ⬇️⬇️⬇️
       ========================================================= */
    const LINKS = {
      // 1. Link4M — nút đặc biệt (khuyên dùng)
      link4m: "https://link4m.co/abcxyz",

      // 2. Bumx — có thể có 1 hoặc cả 2 (Review / Lấy mã)
      //    Để trống "" nếu không dùng
      bumxReview: "https://bumx.co/review-abcxyz",
      bumxCode:   "https://bumx.co/code-abcxyz",

      // 3. Bbmkts
      bbmkts: "",

      // 4. LinkForEarn
      linkforearn: ""
    };
    /* =========================================================
       ⬆️⬆️⬆️  KHÔNG CẦN SỬA GÌ BÊN DƯỚI  ⬆️⬆️⬆️
       ========================================================= */

    const container = document.getElementById('links');
    const buttons = [];

    // ---- Slot 1: Link4M (đặc biệt) ----
    if (LINKS.link4m.trim()) {
      buttons.push(`
        <a class="btn btn-special" href="${LINKS.link4m.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="badge">KHUYÊN DÙNG</span>
          <span class="btn-num">1</span>
          <span class="btn-icon">⚡</span>
          <span class="btn-content">
            <span class="btn-title">Link4M</span>
            <span class="btn-desc">Vượt nhanh, ít quảng cáo</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }

    // ---- Slot 2: Bumx (1 hoặc 2 nút) ----
    const bumxReview = LINKS.bumxReview.trim();
    const bumxCode   = LINKS.bumxCode.trim();
    if (bumxReview || bumxCode) {
      const hasBoth = bumxReview && bumxCode;
      let bumxHtml = '<div class="bumx-group">';
      if (bumxReview) {
        bumxHtml += `
          <a class="btn" href="${bumxReview}" target="_blank" rel="noopener noreferrer">
            <span class="btn-num">${hasBoth ? '2' : '2'}</span>
            <span class="btn-icon">🎬</span>
            <span class="btn-content">
              <span class="btn-title">Bumx Review</span>
              <span class="btn-desc">Xem review trước</span>
            </span>
          </a>
        `;
      }
      if (bumxCode) {
        bumxHtml += `
          <a class="btn" href="${bumxCode}" target="_blank" rel="noopener noreferrer">
            <span class="btn-num">2</span>
            <span class="btn-icon">🔑</span>
            <span class="btn-content">
              <span class="btn-title">Bumx Lấy mã</span>
              <span class="btn-desc">Lấy mã tải script</span>
            </span>
          </a>
        `;
      }
      bumxHtml += '</div>';
      buttons.push(bumxHtml);
    }

    // ---- Slot 3: Bbmkts ----
    if (LINKS.bbmkts.trim()) {
      buttons.push(`
        <a class="btn" href="${LINKS.bbmkts.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="btn-num">3</span>
          <span class="btn-icon">💰</span>
          <span class="btn-content">
            <span class="btn-title">Bbmkts</span>
            <span class="btn-desc">Link dự phòng</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }

    // ---- Slot 4: LinkForEarn ----
    if (LINKS.linkforearn.trim()) {
      buttons.push(`
        <a class="btn" href="${LINKS.linkforearn.trim()}" target="_blank" rel="noopener noreferrer">
          <span class="btn-num">4</span>
          <span class="btn-icon">💵</span>
          <span class="btn-content">
            <span class="btn-title">LinkForEarn</span>
            <span class="btn-desc">Link dự phòng</span>
          </span>
          <span class="btn-arrow">→</span>
        </a>
      `);
    }

    // ---- Render ----
    if (buttons.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📭</div>
          Chưa có link nào được thêm. Vui lòng quay lại sau.
        </div>
      `;
    } else {
      container.innerHTML = buttons.join('');
      // Stagger animation
      container.querySelectorAll('.btn').forEach((el, i) => {
        el.style.animationDelay = `${i * 60}ms`;
      });
    }
  })();
  </script>
</body>
</html>
