<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Roblox Mod Hub</title>
  <meta name="description" content="Tổng hợp script, mod, hack Roblox mới nhất">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #070b14;
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --border: rgba(56, 189, 248, 0.12);
      --border-hover: rgba(56, 189, 248, 0.45);
      --text-1: #e2e8f0;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #0ea5e9;
      --accent-2: #0284c7;
      --accent-soft: #7dd3fc;
      --accent-glow: rgba(14, 165, 233, 0.28);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 450px at 20% 0%, rgba(14, 165, 233, 0.10), transparent 60%),
        radial-gradient(ellipse 600px 450px at 80% 100%, rgba(2, 132, 199, 0.08), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 44px;
      animation: fadeUp 0.5s ease-out both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .logo svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }

    h1 {
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-2);
      font-size: 14px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--text-3);
      min-height: 20px;
      animation: fadeUp 0.5s ease-out 0.1s both;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    .dot.loading { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
    .dot.error   { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeUp 0.4s ease-out both;
      position: relative;
      overflow: hidden;
    }

    .item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.07), transparent 50%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .item:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(14, 165, 233, 0.15);
    }

    .item:hover::before { opacity: 1; }
    .item:active { transform: translateY(0); }

    .item-icon {
      position: relative;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(2, 132, 199, 0.15));
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s;
    }

    .item-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--accent-soft);
    }

    .item:hover .item-icon { transform: scale(1.08) rotate(-4deg); }

    .item-content {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .item-file {
      font-size: 12px;
      color: var(--text-3);
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-arrow {
      flex-shrink: 0;
      color: var(--text-3);
      transition: all 0.25s;
      font-size: 18px;
    }

    .item:hover .item-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    .skeleton {
      height: 80px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, var(--bg-1) 25%, var(--bg-2) 50%, var(--bg-1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border: 1px solid var(--border);
    }

    .state {
      text-align: center;
      padding: 48px 24px;
      background: var(--bg-1);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-2);
      font-size: 14px;
    }

    .state-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .refresh {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 32px auto 0;
      padding: 10px 18px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh:hover {
      border-color: var(--border-hover);
      color: var(--text-1);
      background: rgba(14, 165, 233, 0.06);
    }

    .refresh:disabled { opacity: 0.4; cursor: not-allowed; }
    .refresh.spinning .refresh-icon { animation: spin 0.8s linear infinite; }

    footer {
      text-align: center;
      margin-top: 56px;
      font-size: 12px;
      color: var(--text-3);
    }

    footer a {
      color: var(--text-2);
      text-decoration: none;
      border-bottom: 1px dotted var(--border);
    }

    footer a:hover { color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .wrap { padding: 40px 16px 60px; }
      .item { padding: 16px; gap: 14px; }
      .item-icon { width: 40px; height: 40px; }
      .logo { width: 60px; height: 60px; }
      .logo svg { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.674 1.268 1.269 22.719l17.057.011 4.405-21.463L5.674 1.268zM16.32 15.771l-6.339 1.302-1.302-6.34 6.34-1.301 1.301 6.339z"/>
        </svg>
      </div>
      <h1>Roblox Mod Hub</h1>
      <p class="subtitle">Tổng hợp script, mod, hack Roblox mới nhất</p>
    </header>

    <div class="status-bar">
      <span class="dot loading" id="dot"></span>
      <span id="status">Đang tải danh sách...</span>
    </div>

    <div class="list" id="list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <button class="refresh" id="refresh" hidden>
      <span class="refresh-icon">🔄</span>
      <span>Làm mới danh sách</span>
    </button>

    <footer>
      Cập nhật tự động từ <a href="#" id="repo-link" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
  (async () => {
    const CONFIG = {
      owner: '',
      repo: '',
      exclude: ['index.html', 'template.html', '404.html'],
      cacheTTL: 10 * 60 * 1000,
      fetchTitles: true
    };

    const ROBLOX_ICON = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5.674 1.268 1.269 22.719l17.057.011 4.405-21.463L5.674 1.268zM16.32 15.771l-6.339 1.302-1.302-6.34 6.34-1.301 1.301 6.339z"/></svg>`;

    const $dot       = document.getElementById('dot');
    const $status    = document.getElementById('status');
    const $list      = document.getElementById('list');
    const $refresh   = document.getElementById('refresh');
    const $repoLink  = document.getElementById('repo-link');

    const setState = (state, text) => {
      $dot.className = 'dot ' + state;
      $status.textContent = text;
    };

    function detectRepo() {
      if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
      const host = location.hostname;
      if (!host.endsWith('.github.io')) throw new Error('Custom domain: điền owner/repo trong CONFIG');
      const owner = host.replace('.github.io', '');
      const parts = location.pathname.split('/').filter(Boolean);
      const isUserSite = parts.length === 0 || parts[0].endsWith('.html');
      return { owner, repo: isUserSite ? `${owner}.github.io` : parts[0] };
    }

    function formatName(name) {
      return name.replace(/\.html$/, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    async function fetchFileList(owner, repo) {
      const cacheKey = `ghlist:${owner}/${repo}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Date.now() - cached.ts < CONFIG.cacheTTL) return cached.data;
      } catch {}

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) {
        if (res.status === 403) throw new Error('GitHub API hết lượt (60 req/giờ). Đợi 1 lát rồi thử lại.');
        if (res.status === 404) throw new Error('Không tìm thấy repo. Kiểm tra owner/repo trong CONFIG.');
        throw new Error('GitHub API lỗi ' + res.status);
      }

      const arr = await res.json();
      const files = arr
        .filter(f => f.type === 'file' && f.name.endsWith('.html') &&
                     !CONFIG.exclude.includes(f.name) && !f.name.startsWith('.'))
        .map(f => ({
          name: f.name,
          url: './' + f.name,
          rawUrl: f.download_url,
          fallbackTitle: formatName(f.name)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

      try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: files })); } catch {}
      return files;
    }

    async function fetchTitle(file) {
      const cacheKey = `ghtitle:${file.rawUrl}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Date.now() - cached.ts < CONFIG.cacheTTL * 6) return cached.title;
      } catch {}
      try {
        const res = await fetch(file.rawUrl);
        if (!res.ok) throw new Error();
        const html = await res.text();
        const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
        const title = m ? m[1].trim() : file.fallbackTitle;
        try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), title })); } catch {}
        return title;
      } catch { return file.fallbackTitle; }
    }

    function renderEmpty(message, icon = '📭') {
      $list.innerHTML = `<div class="state"><div class="state-icon">${icon}</div>${message}</div>`;
    }

    function renderList(files) {
      if (files.length === 0) {
        renderEmpty('Chưa có video nào. Tạo file <code>.html</code> đầu tiên để bắt đầu!');
        return;
      }
      $list.innerHTML = '';
      files.forEach((f, i) => {
        const a = document.createElement('a');
        a.className = 'item';
        a.href = f.url;
        a.style.animationDelay = `${Math.min(i * 40, 400)}ms`;
        a.innerHTML = `
          <div class="item-icon">${ROBLOX_ICON}</div>
          <div class="item-content">
            <div class="item-title" data-title>${f.fallbackTitle}</div>
            <div class="item-file">${f.name}</div>
          </div>
          <div class="item-arrow">→</div>
        `;
        $list.appendChild(a);
      });
    }

    async function load(isRefresh = false) {
      if (isRefresh) {
        Object.keys(localStorage)
          .filter(k => k.startsWith('ghlist:') || k.startsWith('ghtitle:'))
          .forEach(k => localStorage.removeItem(k));
      }

      $refresh.hidden = true;
      $refresh.classList.add('spinning');
      setState('loading', 'Đang tải danh sách...');
      $list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

      try {
        const { owner, repo } = detectRepo();
        $repoLink.href = `https://github.com/${owner}/${repo}`;
        const files = await fetchFileList(owner, repo);
        renderList(files);
        setState('', `Tổng ${files.length} video Roblox`);
        $refresh.hidden = false;

        if (CONFIG.fetchTitles && files.length > 0) {
          const titleEls = $list.querySelectorAll('[data-title]');
          await Promise.all(files.map(async (f, i) => {
            const title = await fetchTitle(f);
            if (titleEls[i]) titleEls[i].textContent = title;
          }));
        }
      } catch (e) {
        setState('error', e.message);
        renderEmpty(e.message, '⚠️');
        $refresh.hidden = false;
      } finally {
        $refresh.classList.remove('spinning');
      }
    }

    $refresh.addEventListener('click', () => load(true));
    load(false);
  })();
  </script>

  <!-- ================= MUSIC PLAYER ================= -->
  <div class="music-player">
    <button class="music-btn is-muted" id="music-toggle" aria-label="Bật nhạc" title="Bật nhạc nền">
      <svg class="icon-unmuted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg class="icon-muted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </div>

  <div id="yt-music-container" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></div>

  <style>
    .music-player {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
    }

    .music-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 0;
      position: relative;
    }

    .music-btn:hover {
      border-color: #0ea5e9;
      color: #0ea5e9;
      transform: scale(1.08);
      box-shadow: 0 6px 22px rgba(14, 165, 233, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .music-btn:active { transform: scale(0.95); }

    .music-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .music-btn .icon-unmuted { display: none; }
    .music-btn .icon-muted   { display: block; }
    .music-btn:not(.is-muted) .icon-unmuted { display: block; }
    .music-btn:not(.is-muted) .icon-muted   { display: none; }

    .music-btn:not(.is-muted)::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.5);
      animation: musicPulse 2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes musicPulse {
      0%   { transform: scale(1);    opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    @media (max-width: 480px) {
      .music-player { top: 12px; right: 12px; }
      .music-btn { width: 40px; height: 40px; }
      .music-btn svg { width: 18px; height: 18px; }
    }
  </style>

  <script>
  (function() {
    const VIDEO_ID = 'I1nee4q6nrk';

    let player = null;
    let isMuted = true;

    const btn = document.getElementById('music-toggle');

    function updateUI() {
      btn.classList.toggle('is-muted', isMuted);
      btn.setAttribute('aria-label', isMuted ? 'Bật nhạc' : 'Tắt nhạc');
      btn.setAttribute('title', isMuted ? 'Bật nhạc nền' : 'Tắt nhạc nền');
    }

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('yt-music-container', {
        height: '1',
        width: '1',
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          loop: 1,
          playlist: VIDEO_ID,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: function(e) {
            e.target.setVolume(50);
            e.target.mute();
            e.target.playVideo();
            updateUI();
          },
          onStateChange: function(e) {
            if (e.data === 0) e.target.playVideo();
          }
        }
      });
    };

    btn.addEventListener('click', function() {
      if (!player || !player.mute) return;
      isMuted = !isMuted;
      if (isMuted) player.mute();
      else player.unMute();
      updateUI();
    });

    updateUI();
  })();
  </script>
  <!-- =============== END MUSIC PLAYER =============== -->
</body>
</html>
