<script>
  (async () => {
    const ITEM_ICON = `<img src="./assets/logo.jpeg" alt="">`;
    const $dot       = document.getElementById('dot');
    const $status    = document.getElementById('status');
    const $list      = document.getElementById('list');
    const $refresh   = document.getElementById('refresh');

    const setState = (state, text) => {
      $dot.className = 'dot ' + state;
      $status.textContent = text;
    };

    function renderEmpty(message, icon = '📭') {
      $list.innerHTML = `<div class="state"><div class="state-icon">${icon}</div>${message}</div>`;
    }

    function renderList(videos) {
      if (videos.length === 0) {
        renderEmpty('Chưa có video nào. Tạo file <code>.html</code> đầu tiên để bắt đầu!');
        return;
      }
      $list.innerHTML = '';
      videos.forEach((v, i) => {
        const a = document.createElement('a');
        a.className = 'item';
        a.href = './' + v.name; // Trỏ đến file HTML
        a.style.animationDelay = `${Math.min(i * 40, 400)}ms`;
        
        // Định dạng ngày tháng
        const date = new Date(v.updatedAt);
        const dateStr = date.toLocaleDateString('vi-VN');
        
        a.innerHTML = `
          <div class="item-icon">${ITEM_ICON}</div>
          <div class="item-content">
            <div class="item-title">${v.title}</div>
            <div class="item-file">${dateStr} • ${v.name}</div>
          </div>
          <div class="item-arrow">→</div>
        `;
        $list.appendChild(a);
      });
    }

    async function load(isRefresh = false) {
      if (isRefresh) {
        localStorage.removeItem('videosData');
      }

      $refresh.hidden = true;
      $refresh.classList.add('spinning');
      setState('loading', 'Đang tải danh sách...');
      $list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

      try {
        // Kiểm tra cache local để load cho nhanh (không cần gọi API)
        let videos = null;
        const cached = localStorage.getItem('videosData');
        if (cached && !isRefresh) {
          videos = JSON.parse(cached);
        } else {
          // Tải file videos.json tĩnh (ko tốn rate limit)
          const res = await fetch(`./videos.json?t=${Date.now()}`);
          if (!res.ok) throw new Error('Không tải được videos.json. Hãy chờ Action chạy xong.');
          videos = await res.json();
          localStorage.setItem('videosData', JSON.stringify(videos));
        }

        renderList(videos);
        setState('', `Tổng ${videos.length} video Roblox`);
        $refresh.hidden = false;

      } catch (e) {
        setState('error', e.message);
        renderEmpty(e.message, '⚠️');
        $refresh.hidden = false;
      } finally {
        $refresh.classList.remove('spinning');
      }
    }

    $refresh.addEventListener('click', () => load(true));
    load(false);
  })();
  </script>
