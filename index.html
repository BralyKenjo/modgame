<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f1a">
  <title>Roblox Mod Hub</title>
  <meta name="description" content="Tổng hợp mod, script, hack Roblox mới nhất">

  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #0b0f1a;
      --bg-1: #121826;
      --bg-2: #1a2235;
      --border: rgba(148, 163, 184, 0.12);
      --border-hover: rgba(239, 68, 68, 0.5);
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #ef4444;
      --accent-2: #dc2626;
      --accent-glow: rgba(239, 68, 68, 0.35);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 15% 0%, rgba(239, 68, 68, 0.15), transparent 60%),
        radial-gradient(ellipse 500px 400px at 85% 100%, rgba(220, 38, 38, 0.12), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== LAYOUT ========== */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 20px 80px;
    }

    /* ========== HEADER ========== */
    header {
      text-align: center;
      margin-bottom: 44px;
      animation: fadeUp 0.5s ease-out both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px var(--accent-glow);
      font-size: 32px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-2);
      font-size: 14px;
    }

    /* ========== STATUS BAR ========== */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--text-3);
      min-height: 20px;
      animation: fadeUp 0.5s ease-out 0.1s both;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    .dot.loading { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
    .dot.error   { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }

    /* ========== LIST ========== */
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeUp 0.4s ease-out both;
      position: relative;
      overflow: hidden;
    }

    .item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), transparent 50%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .item:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(239, 68, 68, 0.2);
    }

    .item:hover::before { opacity: 1; }
    .item:active { transform: translateY(0); }

    .item-icon {
      position: relative;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2));
      border: 1px solid rgba(248, 113, 113, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.25s;
    }

    .item:hover .item-icon { transform: scale(1.08) rotate(-4deg); }

    .item-content {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .item-file {
      font-size: 12px;
      color: var(--text-3);
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-arrow {
      flex-shrink: 0;
      color: var(--text-3);
      transition: all 0.25s;
      font-size: 18px;
    }

    .item:hover .item-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ========== SKELETON ========== */
    .skeleton {
      height: 80px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, var(--bg-1) 25%, var(--bg-2) 50%, var(--bg-1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border: 1px solid var(--border);
    }

    /* ========== EMPTY / ERROR ========== */
    .state {
      text-align: center;
      padding: 48px 24px;
      background: var(--bg-1);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-2);
      font-size: 14px;
    }

    .state-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* ========== REFRESH BTN ========== */
    .refresh {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 32px auto 0;
      padding: 10px 18px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh:hover {
      border-color: var(--border-hover);
      color: var(--text-1);
      background: rgba(239, 68, 68, 0.05);
    }

    .refresh:disabled { opacity: 0.4; cursor: not-allowed; }

    .refresh.spinning .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    /* ========== FOOTER ========== */
    footer {
      text-align: center;
      margin-top: 56px;
      font-size: 12px;
      color: var(--text-3);
    }

    footer a {
      color: var(--text-2);
      text-decoration: none;
      border-bottom: 1px dotted var(--border);
    }

    footer a:hover { color: var(--accent); }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== MOBILE ========== */
    @media (max-width: 480px) {
      .wrap { padding: 40px 16px 60px; }
      .item { padding: 16px; gap: 14px; }
      .item-icon { width: 40px; height: 40px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🟥</div>
      <h1>Roblox Mod Hub</h1>
      <p class="subtitle">Tổng hợp script, mod, hack Roblox mới nhất</p>
    </header>

    <div class="status-bar">
      <span class="dot loading" id="dot"></span>
      <span id="status">Đang tải danh sách...</span>
    </div>

    <div class="list" id="list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <button class="refresh" id="refresh" hidden>
      <span class="refresh-icon">🔄</span>
      <span>Làm mới danh sách</span>
    </button>

    <footer>
      Cập nhật tự động từ <a href="#" id="repo-link" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
  (async () => {
    // ================= CẤU HÌNH =================
    const CONFIG = {
      // Để trống → tự detect với username.github.io
      // Dùng custom domain → điền tay owner/repo
      owner: '',
      repo: '',

      // File không hiển thị thành nút
      exclude: ['index.html', 'template.html', '404.html'],

      // Cache 10 phút
      cacheTTL: 10 * 60 * 1000,

      // Fetch <title> từ mỗi file (nút đẹp hơn)
      fetchTitles: true,

      // Icon mặc định cho mọi video Roblox
      defaultIcon: '🟥'
    };
    // =============================================

    const $dot       = document.getElementById('dot');
    const $status    = document.getElementById('status');
    const $list      = document.getElementById('list');
    const $refresh   = document.getElementById('refresh');
    const $repoLink  = document.getElementById('repo-link');

    const setState = (state, text) => {
      $dot.className = 'dot ' + state;
      $status.textContent = text;
    };

    // ---------- Detect owner/repo ----------
    function detectRepo() {
      if (CONFIG.owner && CONFIG.repo) {
        return { owner: CONFIG.owner, repo: CONFIG.repo };
      }
      const host = location.hostname;
      if (!host.endsWith('.github.io')) {
        throw new Error('Custom domain: điền owner/repo trong CONFIG');
      }
      const owner = host.replace('.github.io', '');
      const parts = location.pathname.split('/').filter(Boolean);
      const isUserSite = parts.length === 0 || parts[0].endsWith('.html');
      const repo = isUserSite ? `${owner}.github.io` : parts[0];
      return { owner, repo };
    }

    // ---------- Format tên file thành title đẹp ----------
    function formatName(name) {
      return name
        .replace(/\.html$/, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // ---------- Fetch danh sách file ----------
    async function fetchFileList(owner, repo) {
      const cacheKey = `ghlist:${owner}/${repo}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Date.now() - cached.ts < CONFIG.cacheTTL) {
          return cached.data;
        }
      } catch {}

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });

      if (!res.ok) {
        if (res.status === 403) throw new Error('GitHub API hết lượt (60 req/giờ). Đợi 1 lát rồi thử lại.');
        if (res.status === 404) throw new Error('Không tìm thấy repo. Kiểm tra owner/repo trong CONFIG.');
        throw new Error('GitHub API lỗi ' + res.status);
      }

      const arr = await res.json();
      const files = arr
        .filter(f =>
          f.type === 'file' &&
          f.name.endsWith('.html') &&
          !CONFIG.exclude.includes(f.name) &&
          !f.name.startsWith('.')
        )
        .map(f => ({
          name: f.name,
          url: './' + f.name,
          rawUrl: f.download_url,
          icon: CONFIG.defaultIcon,
          fallbackTitle: formatName(f.name)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

      try {
        localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: files }));
      } catch {}
      return files;
    }

    // ---------- Fetch <title> từ file ----------
    async function fetchTitle(file) {
      const cacheKey = `ghtitle:${file.rawUrl}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Date.now() - cached.ts < CONFIG.cacheTTL * 6) return cached.title;
      } catch {}

      try {
        const res = await fetch(file.rawUrl);
        if (!res.ok) throw new Error();
        const html = await res.text();
        const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
        const title = m ? m[1].trim() : file.fallbackTitle;
        try {
          localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), title }));
        } catch {}
        return title;
      } catch {
        return file.fallbackTitle;
      }
    }

    // ---------- Render ----------
    function renderEmpty(message, icon = '📭') {
      $list.innerHTML = `
        <div class="state">
          <div class="state-icon">${icon}</div>
          ${message}
        </div>`;
    }

    function renderList(files) {
      if (files.length === 0) {
        renderEmpty('Chưa có video nào. Tạo file <code>.html</code> đầu tiên để bắt đầu!');
        return;
      }

      $list.innerHTML = '';
      files.forEach((f, i) => {
        const a = document.createElement('a');
        a.className = 'item';
        a.href = f.url;
        a.style.animationDelay = `${Math.min(i * 40, 400)}ms`;
        a.innerHTML = `
          <div class="item-icon">${f.icon}</div>
          <div class="item-content">
            <div class="item-title" data-title>${f.fallbackTitle}</div>
            <div class="item-file">${f.name}</div>
          </div>
          <div class="item-arrow">→</div>
        `;
        $list.appendChild(a);
      });
    }

    // ---------- Main ----------
    async function load(isRefresh = false) {
      if (isRefresh) {
        Object.keys(localStorage)
          .filter(k => k.startsWith('ghlist:') || k.startsWith('ghtitle:'))
          .forEach(k => localStorage.removeItem(k));
      }

      $refresh.hidden = true;
      $refresh.classList.add('spinning');
      setState('loading', 'Đang tải danh sách...');
      $list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

      try {
        const { owner, repo } = detectRepo();
        $repoLink.href = `https://github.com/${owner}/${repo}`;

        const files = await fetchFileList(owner, repo);
        renderList(files);
        setState('', `Tổng ${files.length} video Roblox`);
        $refresh.hidden = false;

        if (CONFIG.fetchTitles && files.length > 0) {
          const titleEls = $list.querySelectorAll('[data-title]');
          await Promise.all(files.map(async (f, i) => {
            const title = await fetchTitle(f);
            if (titleEls[i]) titleEls[i].textContent = title;
          }));
        }
      } catch (e) {
        setState('error', e.message);
        renderEmpty(e.message, '⚠️');
        $refresh.hidden = false;
      } finally {
        $refresh.classList.remove('spinning');
      }
    }

    $refresh.addEventListener('click', () => load(true));
    load(false);
  })();
  </script>
</body>
</html>
